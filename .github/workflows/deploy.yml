name: Deploy to Kualo

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: kualo-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test export normalization
        run: npm test

      - name: Verify production pages and content
        run: npm run verify:export

      - name: Verify hosting root and back up current website
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.DEPLOY_BACKUP_PASSPHRASE }}
        run: python3 scripts/backup-hosting.py

      - name: Retain encrypted pre-deployment backup
        uses: actions/upload-artifact@v4
        with:
          name: website-before-${{ github.run_id }}
          path: ${{ runner.temp }}/saarahs-before-deploy.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
          dangerous-clean-slate: false
